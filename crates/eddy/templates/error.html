<!DOCTYPE html>
<html lang="en"{{THEME_ATTR}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{COLOR_SCHEME}}">
  <title>{{STATUS}} · Verge</title>
  <link rel="stylesheet" href="{{CSS_PATH}}">
</head>
<body class="page-v2">
  {{TOPBAR}}
  <main class="v2-page v2-narrow">
    <div class="status-wrap">
      <section class="status-tile">
        <div class="status-tile__code">{{STATUS}}</div>
        <h1 class="status-tile__heading">{{HEADING}}</h1>
        <p class="status-tile__detail">{{MESSAGE}}</p>
        <div><a class="btn btn-secondary" href="/">Back to the edge console</a></div>
      </section>
    </div>
  </main>
</body>
</html>
